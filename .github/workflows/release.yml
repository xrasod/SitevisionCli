name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p=($2==v)} p&&!/^## /' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No '## $version' section in CHANGELOG.md"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
